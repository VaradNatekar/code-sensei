<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{style}}">

    <title>Code Sensei</title>
</head>

<body>

<div class="container">

    <div class="hero">
        <img src="{{icon}}" class="logo" alt="Code Sensei Logo">

        <h1>Code Sensei</h1>

        <p class="subtitle">
            Learn • Build • Master
        </p>
    </div>

    <div class="welcome">

        <h2>👋 Welcome Back</h2>

        <p>
            Become a better programmer by learning instead of copying.
        </p>

    </div>

    <div class="search">

        <input
            type="text"
            id="prompt"
            placeholder="Ask Code Sensei anything..."
        >

    </div>

    <h3>⚡ Quick Actions</h3>

    <button id="explain" class="card">
        💡 Explain Selected Code
    </button>

    <button id="debug" class="card">
        🐞 Debug My Code
    </button>

    <button id="learn" class="card">
        📚 Learn a Concept
    </button>

    <button id="interview" class="card">
        🧠 Interview Mode
    </button>

    <div class="status">
        🟢 Ready
    </div>

</div>

<script src="{{script}}"></script>

</body>
</html>
