<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{style}}">

    <title>Code Sensei</title>
</head>

<body>

<div class="container">

    <div class="hero">
        <img src="{{icon}}" class="logo" alt="Code Sensei Logo">

        <h1>Code Sensei</h1>

        <p class="subtitle">
            Learn • Build • Master
        </p>
    </div>

    <div class="welcome">

        <h2>👋 Welcome Back</h2>

        <p>
            Become a better programmer by learning instead of copying.
        </p>

    </div>

    <h3>⚡ Quick Actions</h3>


<button id="explain" class="card">
    💡 Explain Selected Code
</button>

<button id="review" class="card">
    📊 Review My Code
</button>

<button id="debug" class="card">
    🐞 Debug My Code
</button>

<button id="learn" class="card">
    📚 Learn a Concept
</button>

<button id="interview" class="card">
    🧠 Interview Mode
</button>

<button id="explainFile" class="card">
    📄 Explain Current File
</button>

<button id="generateTests" class="card">
    🧪 Generate Unit Tests
</button>
<div class="response-card">

    <div class="response-header">

        <h3>🥋 Conversation</h3>

        <button id="copyBtn" class="copy-btn">
            📋 Copy
        </button>

    </div>

    <div id="chatHistory" class="chat-history">

    </div>

</div>

<button id="clearChat" class="clear-btn">
    🗑 Clear Conversation
</button>

    <div id="status" class="status">
        🟢 Ready
    </div>

</div>
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
<script src="{{script}}"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</body>
</html>
